<section class="form-section">
  <div class="form-card">
    @if (isLoading()) {
      <div class="loading-overlay">
        <i class="fas fa-spinner fa-spin fa-3x text-secondary"></i>
        <p>Iniciando sesión...</p>
      </div>
    }

    <h1>Iniciar Sesión</h1>
    <p class="slogan">Ingresa tus credenciales para acceder a tu cuenta.</p>

    @if (inlineError()) {
      <p class="inline-error">{{ inlineError() }}</p>
    }

    <form (submit)="$event.preventDefault(); handleLogin()" 
          [style.opacity]="isLoading() ? '0.5' : '1'"
          [style.pointer-events]="isLoading() ? 'none' : 'auto'">
      
      <div class="form-group">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" placeholder="Tu nombre de usuario"
               [(ngModel)]="username" required [disabled]="isLoading()">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input id="password" name="password" [type]="passwordVisible() ? 'text' : 'password'"
                 placeholder="Tu contraseña secreta" [(ngModel)]="password" required [disabled]="isLoading()">
          
          <button type="button" class="toggle-password" (click)="togglePasswordVisibility()" [disabled]="isLoading()">
            <i class="fas" [class.fa-eye]="!passwordVisible()" [class.fa-eye-slash]="passwordVisible()"></i>
          </button>
        </div>

        <button type="button" class="link-btn password-forgot" (click)="irRecuperarContrasena()" [disabled]="isLoading()">
          ¿Olvidaste tu contraseña?
        </button>
      </div>

      <button type="submit" class="btn-login" [disabled]="isLoading()">
        Ingresar
      </button>

      <div class="links">
        <button type="button" class="link-btn" routerLink="/register" [disabled]="isLoading()">
          ¿No tienes cuenta? Regístrate
        </button>
        <button type="button" class="link-btn link-back" routerLink="/" [disabled]="isLoading()">
          ← Volver al Inicio
        </button>
      </div>
    </form>
  </div>

  @if (showMessage()) {
    <div class="message-modal">
      <div class="message-content" [class.success]="isSuccess()">
        <i class="fas" [class.fa-check-circle]="isSuccess()" [class.fa-times-circle]="!isSuccess()"></i>
        <p>{{ message() }}</p>
      </div>
    </div>
  }
</section>
